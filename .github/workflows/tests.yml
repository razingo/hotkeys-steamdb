name: Tests

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless, so cancel it
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install test tools
        run: npm ci

      - name: Install Chromium and Firefox
        run: npx playwright install --with-deps chromium firefox

      - name: Build the ZIP
        shell: pwsh
        run: ./build.ps1

      - name: Unpack the ZIP
        run: unzip -q dist/*.zip -d dist/extension

      - name: Check the extension with Firefox's validator
        run: npm run lint

      - name: Run tests in Chromium and Firefox
        run: npm test

      - name: Keep test traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
