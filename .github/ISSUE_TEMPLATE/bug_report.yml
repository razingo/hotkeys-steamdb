name: Bug report
description: A shortcut doesn't work, or something else is broken
title: "[Bug]: "
labels: [ "bug" ]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! A few things to check first:
        - **On steamdb.info:** the game popup is open. Wishlist, Follow and Ignore also need the [SteamDB extension](https://github.com/SteamDatabase/BrowserExtension) and your Steam account linked to SteamDB (**Sign in** on steamdb.info).
        - **On the Steam store:** you're signed in to Steam, the mouse is over a game (or you're on a game's page), and "Also on the Steam store" is on in the settings. Not every part of the store has every action, see [Shortcuts](https://github.com/razingo/hotkeys-steamdb#shortcuts).
        - **Right after updating the extension:** refresh the page first.
        - "Extension error … is not valid JSON" comes from the SteamDB extension, not this one. See [Troubleshooting](https://github.com/razingo/hotkeys-steamdb#troubleshooting).

  - type: dropdown
    id: site
    attributes:
      label: Where did it happen?
      options:
        - steamdb.info
        - A Steam store game page
        - The Steam store front page
        - Another Steam store page (search, sale page, ...)
        - The extension's settings
    validations:
      required: true

  - type: dropdown
    id: shortcut
    attributes:
      label: Which shortcuts are affected?
      multiple: true
      options:
        - Store (Q)
        - Wishlist (W)
        - Follow (E)
        - Ignore (R)
        - "Ignore: played elsewhere (T)"
        - None, it's something else
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. If you're on the Steam store, say which section the game was in (for example Discounts & Events).
      placeholder: I hovered over a game on SteamDB's Trending page and pressed W. Nothing happened.
    validations:
      required: true

  - type: input
    id: page
    attributes:
      label: Page address
      description: The address of the page where it happened.
      placeholder: https://steamdb.info/charts/
    validations:
      required: true

  - type: dropdown
    id: steamdb-extension
    attributes:
      label: Is the SteamDB extension installed?
      description: Only matters on steamdb.info.
      options:
        - "Yes"
        - "No"
        - Not sure

  - type: dropdown
    id: signed-in
    attributes:
      label: Are you signed in to Steam (and linked to SteamDB, if it happened on steamdb.info)?
      options:
        - "Yes"
        - "No"
        - Not sure

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Firefox
        - Edge
        - Brave
        - Opera
        - Other Chromium-based browser
    validations:
      required: true

  - type: input
    id: browser-version
    attributes:
      label: Browser version
      placeholder: "140.0"

  - type: input
    id: extension-version
    attributes:
      label: Extension version
      description: Shown on the About tab of the extension's settings.
      placeholder: 1.6.0
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or console errors
      description: A screenshot of the page helps if the site may have changed. Drag images into this box.
